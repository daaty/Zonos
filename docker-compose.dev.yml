version: '3.8'

services:
  zonos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zonos_container
    ports:
      - "7860:7860"
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GRADIO_SHARE=False
      - GRADIO_SERVER_PORT=7860
